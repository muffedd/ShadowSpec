name: Behavior gate

# What this workflow proves (and does not prove)
# ─────────────────────────────────────────────────────────────────────────────
# PROVEN:
#   1. The ShadowSpec engine correctly rejects the known-bad candidate
#      (strip().upper()) — characterization_passed=False, verdict=rejected.
#      This negative-control job is always expected to be green; it proves the
#      gate mechanism is live and can detect the class of regression it targets.
#
#   2. The changed files in the PR are reported and surfaced in the gate step.
#      If the PR touches the fixtures, validator, or runner, the characterization
#      gate re-runs both controls and fails the workflow on any regression.
#
# NOT PROVEN:
#   - The gate does NOT evaluate arbitrary bad PRs submitted by contributors
#     automatically. Branch protection must be enabled (see docs/branch-protection.md)
#     and a required status check configured for "ShadowSpec behavior gate" so
#     that this workflow runs on every PR to main.
#   - The gate does NOT sandbox or execute reviewer-supplied patches. It only
#     runs the three audited server-owned fixture variants.
# ─────────────────────────────────────────────────────────────────────────────
#
# Every pull request to main must pass TWO independent checks:
#
#   1. test        — full pytest suite + coverage (existing gate, unchanged)
#   2. behavior-gate — ShadowSpec differential check:
#                      • negative control: bad patch is REJECTED (always green)
#                      • positive control: narrow patch is ACCEPTED
#                      • characterization gate: fails if narrow regresses
#                      • changed-files report: lists which files this PR touches
#
# See docs/branch-protection.md for how to make this check required.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── 1. Full test suite ────────────────────────────────────────────────────
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pip check
        run: pip check

      - name: pytest (≥85 % coverage required)
        run: pytest --cov=shadowspec --cov-report=term-missing --cov-fail-under=85

      - name: Compile check
        run: python -m compileall -q src app.py fixtures

  # ── 2. Behavior gate ──────────────────────────────────────────────────────
  behavior-gate:
    name: ShadowSpec behavior gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch enough history to diff against the base branch
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ── Derive changed files from the PR diff ─────────────────────────────
      # Compares this branch against the merge-base of the target branch so
      # that only files actually changed in the PR are listed — not all files
      # that differ between head and origin/main since they diverged.
      - name: "Report changed files in this PR"
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "=== Files changed in this PR ==="
          git diff --name-only "$BASE" "$HEAD" || git diff --name-only origin/${{ github.base_ref }}...HEAD
          echo "================================="

      # ── Negative control: bad patch must be REJECTED ──────────────────────
      # This step is ALWAYS expected to pass (exit 0). It confirms the gate
      # mechanism can detect a known regression. It is NOT a gate on the PR.
      - name: "[negative control] bad patch is REJECTED"
        run: |
          set -euo pipefail
          result=$(PYTHONPATH=src python -m shadowspec.cli run bad --format json 2>/dev/null || true)
          echo "$result" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          v = data['validation']
          verdict              = v['verdict']
          char_passed          = v['characterization_passed']
          acceptance_passed    = v['acceptance_passed']
          failed_checks        = v['failed_checks']
          print(f'  verdict              : {verdict}')
          print(f'  characterization_passed : {char_passed}')
          print(f'  acceptance_passed    : {acceptance_passed}')
          print(f'  failed_checks        : {failed_checks}')
          # Gate: bad patch MUST be rejected and MUST fail characterization.
          assert verdict == 'rejected', f'Expected rejected, got {verdict!r}'
          assert char_passed is False,  'Expected characterization_passed=False for bad patch'
          assert acceptance_passed is True, 'Expected acceptance_passed=True for bad patch'
          print()
          print('  [negative control PASSED] bad patch correctly REJECTED by gate')
          "

      # ── Positive control: narrow patch must be ACCEPTED ───────────────────
      - name: "[positive control] narrow patch is ACCEPTED"
        run: |
          set -euo pipefail
          result=$(PYTHONPATH=src python -m shadowspec.cli run narrow --format json)
          echo "$result" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          v = data['validation']
          verdict           = v['verdict']
          char_passed       = v['characterization_passed']
          acceptance_passed = v['acceptance_passed']
          failed_checks     = v['failed_checks']
          print(f'  verdict              : {verdict}')
          print(f'  characterization_passed : {char_passed}')
          print(f'  acceptance_passed    : {acceptance_passed}')
          print(f'  failed_checks        : {failed_checks}')
          assert verdict == 'accepted',     f'Expected accepted, got {verdict!r}'
          assert char_passed is True,       'Expected characterization_passed=True for narrow patch'
          assert acceptance_passed is True, 'Expected acceptance_passed=True for narrow patch'
          assert failed_checks == [],       f'Expected no failed checks, got {failed_checks}'
          print()
          print('  [positive control PASSED] narrow patch correctly ACCEPTED by gate')
          "

      # ── Gate step: characterization must not regress ──────────────────────
      # This is the step that branch protection must require to be green.
      # It runs the narrow (audited correct) candidate and fails hard if
      # characterization_passed is not true.
      #
      # What this step proves: the gate mechanism is live on the audited
      # narrow fixture. It does NOT prove that arbitrary PRs are blocked —
      # that requires branch protection (see docs/branch-protection.md).
      - name: "Characterization gate (must be green to merge)"
        run: |
          set -euo pipefail
          result=$(PYTHONPATH=src python -m shadowspec.cli run narrow --format json)
          echo "$result" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          v = data['validation']
          if not v['characterization_passed']:
              failed = v['failed_checks']
              print('GATE FAILED: preserved characterization behavior was changed.')
              print('Failed checks:')
              for check in failed:
                  print(f'  - {check}')
              print()
              print('This pull request changes behavior that must be preserved.')
              print('Review the diff against the characterization contract and fix')
              print('the patch so it does not alter existing observations.')
              sys.exit(1)
          if not v['acceptance_passed']:
              print('GATE FAILED: acceptance check did not pass.')
              print('The patch does not implement the requested delta.')
              sys.exit(1)
          print('Characterization gate: PASSED')
          print('Acceptance gate:       PASSED')
          print(f'Verdict: {v[\"verdict\"].upper()}')
          "
