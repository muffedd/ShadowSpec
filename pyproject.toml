[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowspec"
version = "0.1.0"
description = "Safe legacy maintenance evidence workbench"
requires-python = ">=3.12"
dependencies = ["streamlit==1.50.0"]

[project.scripts]
shadowspec = "shadowspec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

